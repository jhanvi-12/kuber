<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verification OTP</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f2f2f2;">
    <div
      style="
        margin: 20px auto;
        background-color: #f2f2f2;
        padding: 0;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
      "
    >
      <!-- Header -->
      <div
        style="
          background-color: #7159E3; /* Violet */
        "
      >
      <!-- Logo -->
        <div style="margin-bottom: 15px;">
          <img
            src="{{logo_image}}"
            alt="Kuber"
            width="150"
            style="max-width: 100%; height: auto;"
          />
        </div>
      </div>

      <!-- Body Content -->
      <div style="padding: 20px;">

        <!-- OTP Message -->
        <p
          style="
            color: #333333;
            font-size: 18px;
            font-weight: 600;
            margin: 10px 0;
          "
        >
          Your OTP code for verification is:
        </p>

        <!-- OTP Code -->
        <div
          style="
            display: inline-block;
            padding: 10px 20px;
            margin: 15px 0;
          "
        >
          <span
            style="
              font-size: 35px;
              font-weight: bold;
              color: #7159E3;
              letter-spacing: 2px;
            "
          >
            {{OTP}}
          </span>
        </div>

        <!-- OTP Info -->
        <p
          style="
            color: #666666;
            font-size: 16px;
            font-weight: 500;
            margin: 8px 0;
          "
        >
          This OTP is valid for <strong>2 minutes</strong>.  
          Please do not share it with anyone.
        </p>

        <!-- Warning -->
        <p
          style="
            color: #666666;
            font-size: 16px;
            margin: 35px 0 5px;
          "
        >
          If you did not request this OTP, please ignore this email.
        </p>

        <!-- Support -->
        <p
          style="
            color: #666666;
            font-size: 16px;
            font-weight: 500;
            margin: 5px 0 15px;
          "
        >
          For any queries, contact us at:
          <a
            href="mailto:kubercab.info@gmail.com"
            style="
              color: #0a689b;
              text-decoration: underline;
              font-weight: 600;
            "
          >
            kubercab.info@gmail.com
          </a>
        </p>

        <!-- Footer -->
        <p
          style="
            color: #666666;
            font-size: 16px;
            font-weight: 500;
            margin-top: 15px;
          "
        >
          Thank you<br />
        </p>
      </div>
    </div>
  </body>
</html>
